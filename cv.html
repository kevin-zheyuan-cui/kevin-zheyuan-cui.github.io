<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CV | Kevin Cui (Zheyuan Cui), Princeton Economics</title>
<meta name="description" content="Curriculum vitae of Kevin Zheyuan Cui (Kevin Cui), Ph.D. candidate in Economics at Princeton University.">
<link rel="canonical" href="https://kevin-zheyuan-cui.github.io/cv.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap">
<style>
:root {
  color-scheme: light;
  --accent: #c3661e;
  --accent-soft: #cf854b;
  --ink: #212121;
  --ink-soft: rgba(0, 0, 0, 0.72);
  --ink-faint: rgba(0, 0, 0, 0.55);
  --rule: rgba(0, 0, 0, 0.12);
  --ground: #ffffff;
  --band: #f5f5f5;
  --nav-ink: rgba(0, 0, 0, 0.66);
}

body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: Lato, "Helvetica Neue", Arial, sans-serif;
  font-weight: 400;
  font-size: 15px;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}

a {
  color: var(--accent);
  text-decoration: none;
  border-bottom: 1px solid rgba(195, 102, 30, 0.35);
}

a:hover {
  border-bottom-color: var(--accent);
}

a:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* ---------- top bar ---------- */

.topbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--ground);
  border-bottom: 1px solid var(--rule);
}

.topbar-inner {
  max-width: 1080px;
  margin: 0 auto;
  padding-block: 14px;
  padding-inline: 24px;
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 12px 28px;
}

.wordmark {
  font-size: 19px;
  font-weight: 300;
  color: var(--ink-soft);
  letter-spacing: 0.01em;
  margin-right: auto;
  border-bottom: none;
}

.nav {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 26px;
}

.nav a {
  font-weight: 300;
  font-size: 15px;
  color: var(--nav-ink);
  border-bottom: none;
}

.nav a:hover,
.nav a[aria-current="page"] {
  color: var(--accent);
}

/* ---------- page shell ---------- */

main {
  max-width: 1080px;
  margin: 0 auto;
  padding-block: 40px 90px;
  padding-inline: 24px;
}

h1 {
  font-size: clamp(40px, 8vw, 60px);
  font-weight: 300;
  line-height: 1.15;
  color: var(--accent);
  letter-spacing: 0.005em;
  margin: 0 0 56px;
  text-wrap: balance;
}

h2 {
  font-size: 24px;
  font-weight: 400;
  color: var(--accent);
  margin: 0 0 16px;
  text-wrap: balance;
}

h3 {
  font-size: 17px;
  font-weight: 700;
  color: var(--ink);
  margin: 0 0 4px;
  text-wrap: balance;
}

p {
  margin: 0 0 16px;
  max-width: 68ch;
}

/* ---------- contact block ---------- */

.masthead {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  gap: 40px;
  margin-bottom: 64px;
}

.identity {
  flex: 1 1 280px;
}

.name {
  font-size: clamp(32px, 6vw, 44px);
  font-weight: 300;
  line-height: 1.2;
  color: var(--accent-soft);
  margin: 0 0 24px;
  text-wrap: balance;
}

.contact-lines {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
  font-weight: 400;
}

.portrait {
  flex: 0 1 260px;
  max-width: 100%;
}

.portrait img {
  display: block;
  width: 100%;
  height: auto;
}

.portrait-slot {
  display: grid;
  place-items: center;
  aspect-ratio: 4 / 5;
  max-width: 100%;
  background: var(--band);
  color: var(--ink-faint);
  font-weight: 300;
  text-align: center;
  padding-inline: 16px;
}

/* ---------- sections ---------- */

section {
  margin-bottom: 56px;
}

.band {
  background: var(--band);
  padding-block: 28px;
  padding-inline: 24px;
}

.links-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 14px;
  align-items: baseline;
}

/* ---------- papers ---------- */

.papers {
  display: flex;
  flex-direction: column;
  gap: 34px;
}

.paper h3 a {
  color: var(--accent);
  border-bottom-color: rgba(195, 102, 30, 0.35);
}

.paper .byline {
  color: var(--ink-soft);
  font-style: italic;
  margin: 0 0 6px;
}

.paper .status {
  color: var(--accent-soft);
  font-style: italic;
  margin: 0 0 8px;
}

.paper .note {
  color: var(--ink-faint);
  font-size: 14px;
  margin: 0 0 8px;
}

.paper .venue {
  color: var(--ink-faint);
  font-style: italic;
  margin: 0 0 8px;
}

.paper .abstract {
  margin: 0 0 10px;
}

.paper-links {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 14px;
  font-size: 14px;
}

.todo {
  color: var(--ink-faint);
  font-weight: 300;
}
</style>
</head>

      <a href="research.html">Research</a>
    </nav>
  </div>
</header>

<main>
  <h1>Curriculum Vitae</h1>

  <section>
    <p>
      <a href="cv.pdf" target="_blank" rel="noopener">Curriculum vitae (PDF)</a>
    </p>
    <p class="todo">Last updated September 2026</p>
  </section>
</main>

</body>
</html>
